[project]
name = "portfolio-manager-v2"
version = "0.1.0"
description = "Portfolio manager with FastAPI and HTMX"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "fastapi[standard]>=0.115.0",
    "jinja2>=3.1.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.20",
    "sqlmodel>=0.0.22",
    "yfinance>=0.2.55",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
