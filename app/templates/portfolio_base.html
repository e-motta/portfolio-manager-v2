{% extends "base.html" %}

{% block content %}
<div class="portfolio-page">
  <header class="portfolio-header">
    <div class="portfolio-header__intro">
      <h1 class="portfolio-header__title">{% block portfolio_title %}Portfolio{% endblock %}</h1>
      <p class="portfolio-header__subtitle">{% block portfolio_subtitle %}Holdings and allocation overview{% endblock %}</p>
    </div>
    <nav class="portfolio-tabs" aria-label="Portfolio sections">
      <a href="/"
         class="portfolio-tabs__link{% if portfolio_tab == 'dashboard' %} is-active{% endif %}">
        Dashboard
      </a>
      <a href="/portfolio/holdings"
         class="portfolio-tabs__link{% if portfolio_tab == 'holdings' %} is-active{% endif %}">
        Securities
      </a>
      <a href="/portfolio/investments"
         class="portfolio-tabs__link{% if portfolio_tab == 'investments' %} is-active{% endif %}">
        Other
      </a>
    </nav>
  </header>
  {% block portfolio_content %}{% endblock %}
</div>
{% endblock %}
