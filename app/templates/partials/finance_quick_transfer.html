<form class="finance-quick-form" action="/finance/transfers" method="post">
  <input type="hidden" name="year" value="{{ year }}">
  <div class="finance-quick-form__fields">
    <div class="field finance-quick-form__field">
      <label class="sr-only" for="quick-transfer-month">Month</label>
      <select id="quick-transfer-month" name="month" required>
        {% for month in range(1, 13) %}
        <option value="{{ month }}"{% if month == form_default_month %} selected{% endif %}>
          {{ month_labels[month - 1] }}
        </option>
        {% endfor %}
      </select>
    </div>
    <div class="field finance-quick-form__field">
      <label class="sr-only" for="quick-transfer-from">From account</label>
      <select id="quick-transfer-from" name="from_account" required>
        {% for account in transfer_accounts %}
        <option value="{{ account }}"{% if account == 'Nuconta' %} selected{% endif %}>{{ account }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field finance-quick-form__field">
      <label class="sr-only" for="quick-transfer-to">To account</label>
      <select id="quick-transfer-to" name="to_account" required>
        {% for account in transfer_accounts %}
        <option value="{{ account }}"{% if account == 'Nubank' %} selected{% endif %}>{{ account }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field finance-quick-form__field finance-quick-form__field--grow">
      <label class="sr-only" for="quick-transfer-description">Description</label>
      <input id="quick-transfer-description" type="text" name="description"
             placeholder="Optional note">
    </div>
    <div class="field finance-quick-form__field">
      <label class="sr-only" for="quick-transfer-amount">Amount</label>
      <input id="quick-transfer-amount" class="input-md" type="number" name="amount"
             placeholder="0.00" step="0.01" min="0.01" inputmode="decimal" required>
    </div>
    <button type="submit" class="btn btn-primary finance-quick-form__submit">Add</button>
  </div>
</form>
