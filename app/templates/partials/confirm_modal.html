<div id="confirm-modal" class="confirm-modal" hidden>
  <div class="confirm-modal__backdrop" data-confirm-dismiss tabindex="-1" aria-hidden="true"></div>
  <div class="confirm-modal__dialog" role="alertdialog" aria-modal="true"
       aria-labelledby="confirm-modal-title" aria-describedby="confirm-modal-message">
    <h2 id="confirm-modal-title" class="confirm-modal__title">Confirm deletion</h2>
    <p id="confirm-modal-message" class="confirm-modal__message"></p>
    <div class="confirm-modal__actions">
      <button type="button" class="btn btn-secondary" data-confirm-cancel autofocus>Cancel</button>
      <button type="button" class="btn btn-danger" data-confirm-ok>Delete</button>
    </div>
  </div>
</div>
