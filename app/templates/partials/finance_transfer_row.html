{% from "partials/icons.html" import icon_edit, icon_save, icon_cancel, icon_delete %}
<tr id="transfer-{{ entry.id }}" class="editable-row finance-entry-row">
  <form hx-post="/finance/transfers/{{ entry.id }}"
        hx-target="#transfer-{{ entry.id }}"
        hx-swap="outerHTML"
        class="row-form-table">
    <td>
      <span class="view-mode cell-primary">{{ entry.from_account }}</span>
      <select class="edit-mode" name="from_account" required>
        {% for account in transfer_accounts %}
        <option value="{{ account }}"{% if account == entry.from_account %} selected{% endif %}>{{ account }}</option>
        {% endfor %}
      </select>
    </td>
    <td>
      <span class="view-mode cell-primary">{{ entry.to_account }}</span>
      <select class="edit-mode" name="to_account" required>
        {% for account in transfer_accounts %}
        <option value="{{ account }}"{% if account == entry.to_account %} selected{% endif %}>{{ account }}</option>
        {% endfor %}
      </select>
    </td>
    <td>
      <span class="view-mode">{{ entry.description or "—" }}</span>
      <input class="edit-mode" type="text" name="description" value="{{ entry.description }}">
    </td>
    <td>
      <span class="view-mode">
        {% if entry.transaction_date %}{{ entry.transaction_date.isoformat() }}{% else %}—{% endif %}
      </span>
      <input class="edit-mode" type="date" name="transaction_date"
             value="{% if entry.transaction_date %}{{ entry.transaction_date.isoformat() }}{% endif %}">
    </td>
    <td class="num">
      <span class="view-mode editable-value money pl-positive">{{ entry.amount|brl }}</span>
      <input class="edit-mode input-md" type="number" name="amount"
             value="{{ '%.2f'|format(entry.amount) }}"
             step="0.01" min="0.01" inputmode="decimal" required>
    </td>
    <td class="actions-cell">
      <div class="view-mode actions-inline">
        <button type="button" class="btn btn-secondary btn-small btn-icon-only btn-edit"
                aria-label="Edit" title="Edit">{{ icon_edit() }}</button>
        <button type="button" class="btn btn-secondary btn-small btn-icon-only btn-delete"
                hx-delete="/finance/transfers/{{ entry.id }}"
                hx-target="#transfer-{{ entry.id }}"
                hx-swap="outerHTML"
                hx-confirm="Delete this transfer?"
                aria-label="Delete" title="Delete">{{ icon_delete() }}</button>
      </div>
      <div class="edit-mode actions-inline">
        <button type="submit" class="btn btn-secondary btn-small btn-icon-only"
                aria-label="Save" title="Save">{{ icon_save() }}</button>
        <button type="button" class="btn btn-secondary btn-small btn-icon-only btn-cancel-edit"
                aria-label="Cancel" title="Cancel">{{ icon_cancel() }}</button>
      </div>
    </td>
  </form>
</tr>
