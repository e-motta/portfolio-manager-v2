<div id="add-investment-modal" class="form-modal" hidden>
  <div class="form-modal__backdrop" data-form-modal-dismiss tabindex="-1" aria-hidden="true"></div>
  <div class="form-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="add-investment-modal-title">
    <div class="form-modal__header">
      <h2 id="add-investment-modal-title" class="form-modal__title">Add investment</h2>
      <button type="button"
              class="form-modal__close btn btn-secondary btn-icon-only"
              data-form-modal-dismiss
              aria-label="Close">
        <span aria-hidden="true">×</span>
      </button>
    </div>
    <div class="form-modal__body">
      <form class="inline-form form-grid"
            action="/portfolio/investments"
            method="post">
        <div class="field">
          <label for="add-investment-institution">Bank / institution</label>
          <input id="add-investment-institution" type="text" name="institution"
                 placeholder="Nubank, XP, Caixa" required>
        </div>
        <div class="field">
          <label for="add-investment-name">Investment</label>
          <input id="add-investment-name" type="text" name="name" placeholder="CDB 120% CDI" required>
        </div>
        <div class="field">
          <label for="add-investment-type">Asset class</label>
          <select id="add-investment-type" name="asset_type_id" required>
            {% for asset_type in asset_types %}
            <option value="{{ asset_type.id }}">{{ asset_type.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="field">
          <label for="add-investment-current">Current value (BRL)</label>
          <input id="add-investment-current" class="input-md" type="number" name="current_value"
                 placeholder="0.00" step="0.01" min="0" required>
        </div>
        <button type="submit" class="btn btn-primary">Add investment</button>
      </form>
    </div>
  </div>
</div>
