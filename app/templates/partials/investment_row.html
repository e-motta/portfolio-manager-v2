{% from "partials/icons.html" import icon_edit, icon_save, icon_cancel, icon_delete %}
<tr id="investment-{{ investment.id }}" class="editable-row">
  <form hx-post="/portfolio/investments/{{ investment.id }}"
        hx-target="#investment-{{ investment.id }}"
        hx-swap="outerHTML"
        class="row-form-table">
    <td>
      <span class="view-mode">{{ investment.institution or "—" }}</span>
      <input class="edit-mode" type="text" name="institution" value="{{ investment.institution }}"
             placeholder="e.g. Nubank" required>
    </td>
    <td>
      <span class="view-mode"><strong>{{ investment.name }}</strong></span>
      <input class="edit-mode" type="text" name="name" value="{{ investment.name }}" required>
    </td>
    <td>
      <span class="view-mode">{{ investment.asset_type.name }}</span>
      <select class="edit-mode" name="asset_type_id" required>
        {% for asset_type in asset_types %}
        <option value="{{ asset_type.id }}"{% if asset_type.id == investment.asset_type_id %} selected{% endif %}>
          {{ asset_type.name }}
        </option>
        {% endfor %}
      </select>
    </td>
    <td class="num">
      <span class="view-mode editable-value">{{ investment.current_value|brl }}</span>
      <input class="edit-mode input-md" type="number" name="current_value"
             value="{{ '%.2f'|format(investment.current_value) }}"
             step="0.01" min="0" required>
    </td>
    <td class="cell-sub">{{ investment.updated_at|datetime_fmt }}</td>
    <td class="actions-cell">
      <div class="view-mode actions-inline">
        <button type="button" class="btn btn-secondary btn-small btn-icon-only btn-edit"
                aria-label="Edit" title="Edit">{{ icon_edit() }}</button>
        <button type="button" class="btn btn-secondary btn-small btn-icon-only btn-delete"
                hx-delete="/portfolio/investments/{{ investment.id }}"
                hx-target="#investment-{{ investment.id }}"
                hx-swap="outerHTML"
                hx-confirm="Delete this investment?"
                aria-label="Delete" title="Delete">{{ icon_delete() }}</button>
      </div>
      <div class="edit-mode actions-inline">
        <button type="submit" class="btn btn-secondary btn-small btn-icon-only"
                aria-label="Save" title="Save">{{ icon_save() }}</button>
        <button type="button" class="btn btn-secondary btn-small btn-icon-only btn-cancel-edit"
                aria-label="Cancel" title="Cancel">{{ icon_cancel() }}</button>
        <button type="button" class="btn btn-secondary btn-small btn-icon-only btn-delete"
                hx-delete="/portfolio/investments/{{ investment.id }}"
                hx-target="#investment-{{ investment.id }}"
                hx-swap="outerHTML"
                hx-confirm="Delete this investment?"
                aria-label="Delete" title="Delete">{{ icon_delete() }}</button>
      </div>
    </td>
  </form>
</tr>
