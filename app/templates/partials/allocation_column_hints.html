{% from "partials/icons.html" import icon_info %}

{% macro allocation_column_head() %}
<span class="th-with-tip th-with-tip--start">
  Allocation
  <span class="info-tip info-tip--popover info-tip--start" tabindex="0"
        aria-label="Allocation legend: current, target, excess">
    {{ icon_info() }}
    <span class="info-popover" role="tooltip">
      <span class="alloc-key">
        <span class="alloc-key__item"><span class="alloc-key__swatch alloc-key__swatch--current"></span> current</span>
        <span class="alloc-key__item"><span class="alloc-key__swatch alloc-key__swatch--marker"></span> target</span>
        <span class="alloc-key__item"><span class="alloc-key__swatch alloc-key__swatch--overweight"></span> excess</span>
      </span>
    </span>
  </span>
</span>
{% endmacro %}
