<header class="finance-header">
  <div class="finance-header__intro">
    <h1 class="finance-header__title">{% block finance_title %}Finance{% endblock %}</h1>
    <p class="finance-header__subtitle">{% block finance_subtitle %}Track income and spending in BRL{% endblock %}</p>
  </div>
  <nav class="finance-tabs" aria-label="Finance sections">
    <a href="/finance/summary?year={{ year }}&month={{ selected_month }}"
       class="finance-tabs__link{% if finance_tab == 'summary' %} is-active{% endif %}">
      Summary
    </a>
    <a href="/finance/income?year={{ year }}{% if filter_month is defined and filter_month %}&month={{ filter_month }}{% endif %}"
       class="finance-tabs__link{% if finance_tab == 'income' %} is-active{% endif %}">
      Income
    </a>
    <a href="/finance/expenses?year={{ year }}{% if filter_month is defined and filter_month %}&month={{ filter_month }}{% endif %}"
       class="finance-tabs__link{% if finance_tab == 'expenses' %} is-active{% endif %}">
      Expenses
    </a>
  </nav>
</header>
