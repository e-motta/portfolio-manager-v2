<div id="import-modal" class="import-modal" hidden>
  <div class="import-modal__backdrop" data-import-modal-dismiss tabindex="-1" aria-hidden="true"></div>
  <div class="import-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="import-modal-title">
    <div class="import-modal__header">
      <h2 id="import-modal-title" class="import-modal__title">Import from statement</h2>
      <button type="button"
              class="import-modal__close btn btn-secondary btn-icon-only"
              data-import-modal-dismiss
              aria-label="Close">
        <span aria-hidden="true">×</span>
      </button>
    </div>
    <div id="import-modal-body" class="import-modal__body"></div>
  </div>
</div>
