<div id="add-income-modal" class="form-modal" hidden>
  <div class="form-modal__backdrop" data-form-modal-dismiss tabindex="-1" aria-hidden="true"></div>
  <div class="form-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="add-income-modal-title">
    <div class="form-modal__header">
      <h2 id="add-income-modal-title" class="form-modal__title">Add income</h2>
      <button type="button"
              class="form-modal__close btn btn-secondary btn-icon-only"
              data-form-modal-dismiss
              aria-label="Close">
        <span aria-hidden="true">×</span>
      </button>
    </div>
    <div class="form-modal__body">
      <form class="inline-form form-grid" action="/finance/income" method="post">
        <input type="hidden" name="year" value="{{ year }}">
        <div class="field">
          <label for="add-income-month">Month</label>
          <select id="add-income-month" name="month" required>
            {% for month in range(1, 13) %}
            <option value="{{ month }}"{% if month == form_default_month %} selected{% endif %}>
              {{ month_labels[month - 1] }}
            </option>
            {% endfor %}
          </select>
        </div>
        <div class="field">
          <label for="add-income-category">Category</label>
          <select id="add-income-category" name="category" required>
            {% for category in income_categories %}
            <option value="{{ category }}"{% if category == 'Outros' %} selected{% endif %}>{{ category }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="field">
          <label for="add-income-description">Description</label>
          <input id="add-income-description" type="text" name="description"
                 placeholder="Salary, freelance, reimbursement…" required>
        </div>
        <div class="field">
          <label for="add-income-amount">Amount (BRL)</label>
          <input id="add-income-amount" class="input-md" type="number" name="amount"
                 placeholder="0.00" step="0.01" min="0" inputmode="decimal" required>
        </div>
        <button type="submit" class="btn btn-primary">Add income</button>
      </form>
    </div>
  </div>
</div>
