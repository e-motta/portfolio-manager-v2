<form class="finance-quick-form" action="/finance/investments" method="post">
  <input type="hidden" name="year" value="{{ year }}">
  <div class="finance-quick-form__fields">
    <div class="finance-quick-form__row">
      <div class="field finance-quick-form__field finance-quick-form__field--month">
        <label class="sr-only" for="quick-investment-month">Month</label>
        <select id="quick-investment-month" name="month" required>
          {% for month in range(1, 13) %}
          <option value="{{ month }}"{% if month == form_default_month %} selected{% endif %}>
            {{ month_labels[month - 1] }}
          </option>
          {% endfor %}
        </select>
      </div>
      <div class="field finance-quick-form__field finance-quick-form__field--broker">
        <label class="sr-only" for="quick-investment-broker">Broker</label>
        <select id="quick-investment-broker" name="broker" required>
          {% for broker_key, broker_label in investment_brokers %}
          <option value="{{ broker_key }}">{{ broker_label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field finance-quick-form__field finance-quick-form__field--amount">
        <label class="sr-only" for="quick-investment-amount">Amount</label>
        <input id="quick-investment-amount" type="number" name="amount"
               placeholder="0.00" step="0.01" min="0" inputmode="decimal" required>
      </div>
      <button type="submit" class="btn btn-primary finance-quick-form__submit">Add</button>
    </div>
  </div>
</form>
