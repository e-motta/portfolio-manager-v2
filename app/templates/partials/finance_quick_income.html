<form class="finance-quick-form" action="/finance/income" method="post">
  <input type="hidden" name="year" value="{{ year }}">
  <div class="finance-quick-form__fields">
    <div class="field finance-quick-form__field">
      <label class="sr-only" for="quick-income-month">Month</label>
      <select id="quick-income-month" name="month" required>
        {% for month in range(1, 13) %}
        <option value="{{ month }}"{% if month == form_default_month %} selected{% endif %}>
          {{ month_labels[month - 1] }}
        </option>
        {% endfor %}
      </select>
    </div>
    <div class="field finance-quick-form__field finance-quick-form__field--grow">
      <label class="sr-only" for="quick-income-description">Description</label>
      <input id="quick-income-description" type="text" name="description"
             placeholder="What was this income?" required>
    </div>
    <div class="field finance-quick-form__field">
      <label class="sr-only" for="quick-income-amount">Amount</label>
      <input id="quick-income-amount" class="input-md" type="number" name="amount"
             placeholder="0.00" step="0.01" min="0" inputmode="decimal" required>
    </div>
    <button type="submit" class="btn btn-primary finance-quick-form__submit">Add</button>
  </div>
</form>
