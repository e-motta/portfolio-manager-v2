<nav class="finance-months" aria-label="Select month">
  {% if show_all_option %}
  <a href="{{ base_path }}?year={{ year }}"
     class="finance-months__pill{% if not filter_month %} is-active{% endif %}{% if not filter_month and not month_activity is defined %} is-current{% endif %}">
    All
  </a>
  {% endif %}
  {% for month in range(1, 13) %}
  <a href="{{ base_path }}?year={{ year }}&month={{ month }}"
     class="finance-months__pill{% if (filter_month is not defined and selected_month == month) or filter_month == month %} is-active{% endif %}{% if month_activity is defined and month_activity[month] %} has-data{% elif month_totals is defined and month_totals[month] != 0 %} has-data{% endif %}"
     title="{{ month_labels[month - 1] }}">
    <span class="finance-months__short">{{ month_labels[month - 1][:3] }}</span>
    {% if show_amounts is defined and show_amounts %}
    <span class="finance-months__amount">{{ month_totals[month]|pl_brl }}</span>
    {% endif %}
  </a>
  {% endfor %}
</nav>
