<div class="layout-toggle btn-group{% if extra_class %} {{ extra_class }}{% endif %}"
     role="group" aria-label="Navigation layout">
  <button type="button" class="layout-toggle__btn" data-layout-value="sidebar"
          aria-pressed="true" aria-label="Sidebar navigation" title="Sidebar navigation">
    <svg class="layout-toggle__icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <rect x="1.5" y="2.5" width="13" height="11" rx="1.5" stroke="currentColor" stroke-width="1.25"/>
      <path d="M5.5 2.5v11" stroke="currentColor" stroke-width="1.25"/>
    </svg>
  </button>
  <button type="button" class="layout-toggle__btn" data-layout-value="top"
          aria-pressed="false" aria-label="Top navigation" title="Top navigation">
    <svg class="layout-toggle__icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <rect x="1.5" y="2.5" width="13" height="11" rx="1.5" stroke="currentColor" stroke-width="1.25"/>
      <path d="M1.5 6h13" stroke="currentColor" stroke-width="1.25"/>
    </svg>
  </button>
</div>
