{% from "partials/icons.html" import icon_edit, icon_save, icon_cancel %}
<li id="summary-{{ row.key }}" class="finance-line finance-line--editable editable-row">
  <span class="finance-line__label">{{ row.label }}</span>
  <div class="finance-line__value">
    <form class="finance-line-form"
          hx-post="/finance/summary/cell"
          hx-target="#summary-{{ row.key }}"
          hx-swap="outerHTML">
      <input type="hidden" name="year" value="{{ year }}">
      <input type="hidden" name="month" value="{{ selected_month }}">
      <input type="hidden" name="line_key" value="{{ row.key }}">
      <div class="view-mode finance-line__actions">
        <span class="money {{ value|pl_class }}">{{ value|pl_brl }}</span>
        <button type="button" class="btn btn-secondary btn-small btn-icon-only btn-edit"
                aria-label="Edit {{ row.label }}" title="Edit">{{ icon_edit() }}</button>
      </div>
      <div class="edit-mode finance-line__actions">
        <input class="finance-line-input edit-mode" type="number" name="amount"
               value="{{ '%.2f'|format(-value if value < 0 else value) if row.section == 'expenses_contas' else '%.2f'|format(value) }}"
               step="0.01"{% if row.section == 'expenses_contas' %} min="0"{% endif %}
               inputmode="decimal" aria-label="{{ row.label }}" required>
        <button type="submit" class="btn btn-secondary btn-small btn-icon-only"
                aria-label="Confirm {{ row.label }}" title="Confirm">{{ icon_save() }}</button>
        <button type="button" class="btn btn-secondary btn-small btn-icon-only btn-cancel-edit"
                aria-label="Cancel" title="Cancel">{{ icon_cancel() }}</button>
      </div>
    </form>
  </div>
</li>
