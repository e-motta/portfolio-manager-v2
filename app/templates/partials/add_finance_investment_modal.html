<div id="add-investment-modal" class="form-modal" hidden>
  <div class="form-modal__backdrop" data-form-modal-dismiss tabindex="-1" aria-hidden="true"></div>
  <div class="form-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="add-investment-modal-title">
    <div class="form-modal__header">
      <h2 id="add-investment-modal-title" class="form-modal__title">Add contribution</h2>
      <button type="button"
              class="form-modal__close btn btn-secondary btn-icon-only"
              data-form-modal-dismiss
              aria-label="Close">
        <span aria-hidden="true">×</span>
      </button>
    </div>
    <div class="form-modal__body">
      <form class="inline-form form-grid" action="/finance/investments" method="post">
        <input type="hidden" name="year" value="{{ year }}">
        <div class="field">
          <label for="add-investment-month">Month</label>
          <select id="add-investment-month" name="month" required>
            {% for month in range(1, 13) %}
            <option value="{{ month }}"{% if month == form_default_month %} selected{% endif %}>
              {{ month_labels[month - 1] }}
            </option>
            {% endfor %}
          </select>
        </div>
        <div class="field">
          <label for="add-investment-broker">Broker</label>
          <select id="add-investment-broker" name="broker" required>
            {% for broker_key, broker_label in investment_brokers %}
            <option value="{{ broker_key }}">{{ broker_label }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="field">
          <label for="add-investment-amount">Amount (BRL)</label>
          <input id="add-investment-amount" class="input-md" type="number" name="amount"
                 placeholder="0.00" step="0.01" min="0" inputmode="decimal" required>
        </div>
        <button type="submit" class="btn btn-primary">Add contribution</button>
      </form>
    </div>
  </div>
</div>
