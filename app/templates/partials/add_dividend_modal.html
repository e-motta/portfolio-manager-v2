<div id="add-dividend-modal" class="form-modal" hidden>
  <div class="form-modal__backdrop" data-form-modal-dismiss tabindex="-1" aria-hidden="true"></div>
  <div class="form-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="add-dividend-modal-title">
    <div class="form-modal__header">
      <h2 id="add-dividend-modal-title" class="form-modal__title">Add dividend</h2>
      <button type="button"
              class="form-modal__close btn btn-secondary btn-icon-only"
              data-form-modal-dismiss
              aria-label="Close">
        <span aria-hidden="true">×</span>
      </button>
    </div>
    <div class="form-modal__body">
      <section class="form-modal__section">
        <h3 class="form-modal__section-title">Record manually</h3>
        <form class="inline-form form-grid"
              action="/portfolio/holdings/dividends"
              method="post">
          <div class="field">
            <label for="add-dividend-symbol">Ticker</label>
            <input id="add-dividend-symbol" type="text" name="symbol" placeholder="VTI" required>
          </div>
          <div class="field">
            <label for="add-dividend-date">Pay date</label>
            <input id="add-dividend-date" type="date" name="pay_date" value="{{ today }}" required>
          </div>
          <div class="field">
            <label for="add-dividend-gross">Gross amount (USD)</label>
            <input id="add-dividend-gross" class="input-price" type="number" name="gross_amount_usd" step="0.01" min="0" required>
          </div>
          <div class="field">
            <label for="add-dividend-withholding">Withholding tax (USD) <span class="muted">(optional)</span></label>
            <input id="add-dividend-withholding" class="input-price" type="number" name="withholding_tax_usd" step="0.01" min="0" value="0">
          </div>
          <button type="submit" class="btn btn-primary">Add dividend</button>
        </form>
      </section>

      <div class="form-modal__divider" aria-hidden="true"><span>or</span></div>

      <section class="form-modal__section">
        <h3 class="form-modal__section-title">Import from statement</h3>
        <p class="form-modal__section-desc">Interactive Brokers activity statement · CSV export from Reports</p>
        {% with preview_url="/portfolio/holdings/dividends/import/preview", preview_label="Preview dividends" %}
        {% include "partials/statement_import_dropzone.html" %}
        {% endwith %}
      </section>
    </div>
  </div>
</div>
