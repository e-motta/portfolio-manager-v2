<div id="add-transfer-modal" class="form-modal" hidden>
  <div class="form-modal__backdrop" data-form-modal-dismiss tabindex="-1" aria-hidden="true"></div>
  <div class="form-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="add-transfer-modal-title">
    <div class="form-modal__header">
      <h2 id="add-transfer-modal-title" class="form-modal__title">Add transfer</h2>
      <button type="button"
              class="form-modal__close btn btn-secondary btn-icon-only"
              data-form-modal-dismiss
              aria-label="Close">
        <span aria-hidden="true">×</span>
      </button>
    </div>
    <div class="form-modal__body">
      <form class="inline-form form-grid" action="/finance/transfers" method="post">
        <input type="hidden" name="year" value="{{ year }}">
        <div class="field">
          <label for="add-transfer-month">Month</label>
          <select id="add-transfer-month" name="month" required>
            {% for month in range(1, 13) %}
            <option value="{{ month }}"{% if month == form_default_month %} selected{% endif %}>
              {{ month_labels[month - 1] }}
            </option>
            {% endfor %}
          </select>
        </div>
        <div class="field">
          <label for="add-transfer-date">Date</label>
          <input id="add-transfer-date" type="date" name="transaction_date">
        </div>
        <div class="field">
          <label for="add-transfer-from">From account</label>
          <select id="add-transfer-from" name="from_account" required>
            {% for account in transfer_accounts %}
            <option value="{{ account }}"{% if account == 'Nuconta' %} selected{% endif %}>{{ account }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="field">
          <label for="add-transfer-to">To account</label>
          <select id="add-transfer-to" name="to_account" required>
            {% for account in transfer_accounts %}
            <option value="{{ account }}"{% if account == 'Nubank' %} selected{% endif %}>{{ account }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="field">
          <label for="add-transfer-description">Description</label>
          <input id="add-transfer-description" type="text" name="description"
                 placeholder="Optional note">
        </div>
        <div class="field">
          <label for="add-transfer-amount">Amount (BRL)</label>
          <input id="add-transfer-amount" class="input-md" type="number" name="amount"
                 placeholder="0.00" step="0.01" min="0.01" inputmode="decimal" required>
        </div>
        <button type="submit" class="btn btn-primary">Add transfer</button>
      </form>
    </div>
  </div>
</div>
