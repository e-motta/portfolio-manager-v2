name: Postgres Migrations

on:
  push:
    branches: [main]
    paths:
      - 'alembic/**'
      - 'app/models/**'
      - 'pyproject.toml'
      - '.github/workflows/postgres-migrations.yml'
  pull_request:
    branches: [main]
    paths:
      - 'alembic/**'
      - 'app/models/**'
      - 'pyproject.toml'
      - '.github/workflows/postgres-migrations.yml'

jobs:
  migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run migrations on Postgres 16
        env:
          DATABASE_URL: postgresql+psycopg://testuser:testpass@localhost:5432/testdb
        run: uv run alembic upgrade head

      - name: Check for model/migration drift
        env:
          DATABASE_URL: postgresql+psycopg://testuser:testpass@localhost:5432/testdb
        run: uv run alembic check
